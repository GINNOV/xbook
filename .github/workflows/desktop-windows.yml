name: Windows desktop

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: file:./build.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run test:desktop
      - name: Build unsigned NSIS installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json
      - name: Verify bundled Node, SQLite and migrations
        run: npm run smoke:desktop
      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: xbook-windows-x64-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
